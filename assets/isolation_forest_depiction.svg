<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Animation showing an outlier being isolated in 3 random cuts, while a normal cluster of points takes 8 or more cuts to fully separate.">

    <text x="24" y="38" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#FBF6F8">How Isolation Forest catches outliers</text>

    <text x="24" y="66" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#F8BBD9">
      <tspan opacity="0">Cut 1 splits the space in two, the outlier already stands apart.</tspan>
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.071;0.085;0.286;0.30;1" dur="14s" repeatCount="indefinite"/>
    </text>
    <text x="24" y="66" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#F8BBD9" opacity="0">
      Cut 2 narrows its box.
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.286;0.30;0.5;0.514;1" dur="14s" repeatCount="indefinite"/>
    </text>
    <text x="24" y="66" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#F8BBD9" opacity="0">
      Cut after cut, normal points stay bunched together.
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5;0.514;0.714;0.728;1" dur="14s" repeatCount="indefinite"/>
    </text>
    <text x="24" y="66" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#F8BBD9" opacity="0">
      Shorter path to isolate = anomaly. That's the idea behind Isolation Forest.
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.714;0.728;0.964;0.978;1" dur="14s" repeatCount="indefinite"/>
    </text>

    <g fill="#8FB8FF" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.036;0.05;1" dur="14s" repeatCount="indefinite"/>
      <circle cx="150" cy="150" r="7"/><circle cx="205" cy="145" r="7"/><circle cx="245" cy="138" r="7"/>
      <circle cx="281" cy="125" r="7"/><circle cx="159" cy="185" r="7"/><circle cx="219" cy="175" r="7"/>
      <circle cx="270" cy="165" r="7"/><circle cx="315" cy="160" r="7"/><circle cx="119" cy="200" r="7"/>
      <circle cx="190" cy="215" r="7"/><circle cx="213" cy="200" r="7"/><circle cx="255" cy="205" r="7"/>
      <circle cx="300" cy="200" r="7"/><circle cx="350" cy="190" r="7"/><circle cx="139" cy="230" r="7"/>
      <circle cx="330" cy="235" r="7"/><circle cx="365" cy="230" r="7"/><circle cx="196" cy="260" r="7"/>
      <circle cx="230" cy="245" r="7"/><circle cx="175" cy="280" r="7"/><circle cx="259" cy="290" r="7"/>
      <circle cx="289" cy="270" r="7"/>
    </g>

    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.036;0.05;1" dur="14s" repeatCount="indefinite"/>
      <circle cx="650" cy="150" r="26" fill="#E91E8C" opacity="0.25"/>
      <circle cx="650" cy="150" r="12" fill="#E91E8C"/>
    </g>

    <g stroke="#C58BA5" stroke-width="3" stroke-linecap="round" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.143;0.157;1" dur="14s" repeatCount="indefinite"/>
      <line x1="480" y1="90" x2="480" y2="360"/>
    </g>

    <g stroke="#C58BA5" stroke-width="3" stroke-linecap="round" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.321;0.335;1" dur="14s" repeatCount="indefinite"/>
      <line x1="480" y1="240" x2="780" y2="240"/>
    </g>

    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.536;0.55;1" dur="14s" repeatCount="indefinite"/>
      <g stroke="#C58BA5" stroke-width="3" stroke-linecap="round">
        <line x1="230" y1="90" x2="230" y2="240"/>
        <line x1="20" y1="140" x2="230" y2="140"/>
        <line x1="20" y1="230" x2="480" y2="230"/>
      </g>
      <rect x="560" y="60" width="220" height="180" fill="#E91E8C" fill-opacity="0.08" stroke="#E91E8C" stroke-width="3" stroke-dasharray="8 6"/>
      <text x="670" y="265" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#E91E8C" text-anchor="middle">3 cuts</text>
    </g>

    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.75;0.764;1" dur="14s" repeatCount="indefinite"/>
      <line x1="140" y1="140" x2="140" y2="230" stroke="#C58BA5" stroke-width="3" stroke-linecap="round"/>
      <text x="24" y="400" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#8FB8FF">8+ cuts</text>
    </g>

  </svg>
